[plugin]

name="Cylinder Cut"
description="Dynamic cylinder cut-through: punches a configurable 3D cylinder between two anchor points (e.g. player and camera) through all intersecting geometry. Works on Forward+ and OpenGL Compatibility. Ships with configurable edge falloff and example edge shaders."
author="GunSword"
version="1.0.0"
script="cylinder_cut_plugin.gd"
